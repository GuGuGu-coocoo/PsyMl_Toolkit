name: Release v0.3.1

on:
  push:
    branches: [release/v0.3.1, publish/v0.3.1, republish/v0.3.1]

permissions:
  contents: read

concurrency:
  group: release-v0.3.1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref == 'refs/heads/release/v0.3.1'
    uses: ./.github/workflows/ci.yml

  native:
    if: github.ref == 'refs/heads/release/v0.3.1'
    name: Native ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS
          - os: windows-latest
            platform: Windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: '3.12.13'
          enable-cache: true
      - run: uv sync --locked --group dev --group build --extra explain
      - uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Build and smoke-test bundled application
        run: uv run --locked --group build --extra explain python tools/build_native.py --permutation-smoke --explain-smoke --coefficients-smoke
      - name: Inspect binaries, archive integrity and source provenance
        run: uv run --locked --group build --extra explain python tools/verify_release_artifacts.py --directory dist --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v0.3.1-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  candidate:
    needs: [quality, native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: '3.12.13'
          enable-cache: true
      - run: uv sync --locked --group dev --extra explain
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v0.3.1-macOS
          path: dist/v0.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v0.3.1-Windows
          path: dist/v0.3.1
      - name: Assemble and verify exact release candidate
        run: uv run --locked python tools/release_v031.py candidate --directory dist/v0.3.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PsyML-v0.3.1-release-candidate
          path: dist/v0.3.1/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/publish/v0.3.1' || github.ref == 'refs/heads/republish/v0.3.1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: '3.12.13'
          enable-cache: true
      - run: uv sync --locked --group dev --extra explain
      - name: Verify successful candidate, upload, re-download and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python tools/release_v031.py ${{ github.ref == 'refs/heads/republish/v0.3.1' && 'replace' || 'publish' }} --directory dist/v0.3.1
