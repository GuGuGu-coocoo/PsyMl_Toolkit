name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check src tests tools

      - name: Test
        run: uv run pytest -q

      - name: Audit tracked research fixtures
        if: runner.os == 'Linux'
        run: uv run python tools/audit_repository.py

      - name: Build distributions
        run: uv build

      - name: Smoke-test wheel
        shell: bash
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py

      - name: Install Godot
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Expose the locked Python environment to Godot
        shell: bash
        run: uv run python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('PSYML_PYTHON=' + sys.executable + '\n')"

      - name: Validate Godot project
        run: godot --headless --editor --path gui --quit

      - name: Test Godot/Core bridge
        run: godot --headless --path gui --script res://tests/test_bridge.gd

      - name: Test complete Godot workflow
        run: godot --headless --path gui --script res://tests/test_ui_flow.gd

      - name: Test researcher feedback interactions
        run: godot --headless --path gui --script res://tests/test_feedback.gd

      - name: Test task-specific parameter state
        run: godot --headless --path gui --script res://tests/test_parameter_context.gd

      - name: Test independent validation result switching
        run: godot --headless --path gui --script res://tests/test_independent_results.gd
