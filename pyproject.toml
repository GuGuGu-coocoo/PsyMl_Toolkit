[project]
name = "psyml-toolkit"
version = "0.1.0"
description = "Legacy Python machine-learning research scripts preserved for modernization."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "graphviz>=0.20,<1",
  "jieba>=0.42,<1",
  "joblib>=1.4,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "torch>=2.5,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.uv]
package = false
