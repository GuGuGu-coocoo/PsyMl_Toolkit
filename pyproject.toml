[project]
name = "psyml-toolkit"
version = "0.1.1rc1"
description = "Reproducible machine-learning workflows for research data."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pyarrow>=17,<24",
  "pyreadstat>=1.2,<2",
  "scikit-learn>=1.5,<2",
  "xlrd>=2,<3",
]

[project.scripts]
psyml = "psyml.cli:entrypoint"

[dependency-groups]
build = [
    "pyinstaller>=6.22,<7",
]
dev = [
  "jsonschema>=4,<5",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "xlwt>=1.3,<2",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/psyml"]

[tool.hatch.build.targets.sdist]
include = [
  "src/psyml",
  "LICENSE",
  "README.md",
  "pyproject.toml",
]
exclude = [
  "/.github",
  "/docs",
  "/examples",
  "/gui",
  "/legacy",
  "/tests",
  "/tools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
